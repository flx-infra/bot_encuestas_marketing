version: '3.8'

# ==============================================================================
# docker-compose.yml
#
# Uso principal: build/test local de las imagenes que luego se publican y
# despliegan en Swarm via docker-stack.yml.
#
# Build y push:
#   docker compose build
#   docker compose push       (requiere DOCKER_REGISTRY definido en .env)
#
# Run local:
#   docker compose up -d
# ==============================================================================

services:
  redis:
    image: redis:7-alpine
    container_name: flexxus-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis_dev_password}", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_dev_password}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    image: ${BACKEND_IMAGE:-flexxus-bot-backend:latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flexxus-backend
    environment:
      # App
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 5060
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DEV_MODE: ${DEV_MODE:-false}

      # Database principal (BotEncuestas - MySQL externo)
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      # Redis (interno al stack)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev_password}
      REDIS_SESSION_TTL: ${REDIS_SESSION_TTL:-86400}

      # WhatsApp Meta Cloud API
      WA_PHONE_NUMBER_ID: ${WA_PHONE_NUMBER_ID}
      WA_ACCESS_TOKEN: ${WA_ACCESS_TOKEN}
      WA_APP_SECRET: ${WA_APP_SECRET}
      WA_VERIFY_TOKEN: ${WA_VERIFY_TOKEN}
      WA_API_VERSION: ${WA_API_VERSION:-v19.0}

      # Email
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_SECURE: ${EMAIL_SECURE:-false}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_RESULTS_RECIPIENT: ${EMAIL_RESULTS_RECIPIENT}

      # Auth (JWT)
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRES: ${JWT_ACCESS_EXPIRES:-15m}
      JWT_REFRESH_EXPIRES: ${JWT_REFRESH_EXPIRES:-7d}

      # Scheduler
      SCHEDULER_TIMEZONE: ${SCHEDULER_TIMEZONE:-America/Argentina/Cordoba}
      SCHEDULER_HOUR: ${SCHEDULER_HOUR:-9}
      SCHEDULER_MINUTE: ${SCHEDULER_MINUTE:-0}

      # Cool-down de encuestas
      COOLDOWN_DAYS: ${COOLDOWN_DAYS:-7}

      # HelpDesk (MySQL externo)
      HELPDESK_DB_HOST: ${HELPDESK_DB_HOST}
      HELPDESK_DB_PORT: ${HELPDESK_DB_PORT}
      HELPDESK_DB_NAME: ${HELPDESK_DB_NAME}
      HELPDESK_DB_USER: ${HELPDESK_DB_USER}
      HELPDESK_DB_PASSWORD: ${HELPDESK_DB_PASSWORD}
      HELPDESK_CRYPTO_KEY: ${HELPDESK_CRYPTO_KEY}
      SYNC_CRON: ${SYNC_CRON:-0 2 * * *}

      # Firebird SAR
      FIREBIRD_HOST: ${FIREBIRD_HOST}
      FIREBIRD_PORT: ${FIREBIRD_PORT:-3050}
      FIREBIRD_DATABASE: ${FIREBIRD_DATABASE}
      FIREBIRD_USER: ${FIREBIRD_USER}
      FIREBIRD_PASSWORD: ${FIREBIRD_PASSWORD}
      SAR_SYNC_ENABLED: ${SAR_SYNC_ENABLED:-false}
      SAR_SYNC_CRON: ${SAR_SYNC_CRON:-0 2 * * *}

      # Dispatcher
      DISPATCHER_URL: ${DISPATCHER_URL}
      DISPATCHER_API_KEY: ${DISPATCHER_API_KEY}
      DISPATCHER_TIMEOUT: ${DISPATCHER_TIMEOUT:-5000}
    ports:
      - "5060:5060"
    volumes:
      - backend_logs:/app/logs
    networks:
      - traefik
    deploy:
      placement:
        constraints:
          - ${NODE}   
    logging:
      driver: loki
      options:
        loki-url: ${LOKI_URL}  
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE:-flexxus-bot-frontend:latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: flexxus-frontend
    ports:
      - "5061:5061"
    depends_on:
      - backend
    networks:
      - traefik
    deploy:
      placement:
        constraints:
          - ${NODE}
      restart_policy:
        condition: on-failure
        max_attempts: 3
    logging:
      driver: loki
      options:
        loki-url: ${LOKI_URL}  
    restart: unless-stopped

volumes:
  redis_data:
  backend_logs:

# ============================================
# Networks
# ============================================
networks:
  traefik:
    name: traefik
    external: true
